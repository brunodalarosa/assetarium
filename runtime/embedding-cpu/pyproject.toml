[project]
name = "local-assets-embedding-cpu-runtime"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
# Same pins as runtime/embedding with CPU-only Torch wheels (decision 0018); installs into .venv-embedding.
dependencies = [
  "torch==2.10.0+cpu", "torchvision==0.25.0+cpu",
  "sentence-transformers==6.1.0", "transformers==5.19.0",
  "pillow==12.1.0", "numpy==2.3.4", "psutil==7.2.2",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

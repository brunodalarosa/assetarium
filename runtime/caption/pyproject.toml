[project]
name = "local-assets-caption-runtime"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "torch==2.10.0+cu128", "torchvision==0.25.0+cu128",
  "transformers==4.57.6", "pillow==12.1.0", "psutil==7.2.2",
]

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }
